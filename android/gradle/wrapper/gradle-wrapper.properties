# Gradle 8.9 is the version this project builds with: it is the minimum the
# Android Gradle Plugin 8.5.2 supports without warnings, and pinning it lets a
# machine with no network build from a warm cache rather than resolving
# "latest" and failing.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
