include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # An accidental `http` or `HttpClient` import would break the offline
    # guarantee, so unused imports are errors rather than hints here.
    unused_import: error
    dead_code: error

linter:
  rules:
    - avoid_print
    - prefer_final_locals
    - unawaited_futures
    - always_declare_return_types
