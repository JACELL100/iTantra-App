; Firmware for the optional embedded bridge.
;
; The problem statement allows streaming to "a wifi/Bluetooth connected
; embedded device". This bridge is an ESP32 that presents both a BLE GATT
; service and a TCP socket, and relays iTantra frames between them, so a
; phone can talk to a fixed radio installation instead of a second phone.
;
; The ESP32 was chosen because it has Wi-Fi and Bluetooth on one die, costs
; a few hundred rupees, and its Arduino core is Apache/LGPL licensed, which
; keeps the whole deliverable open source.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; -Os over -O2: the bridge is I/O bound, and flash headroom matters more than
; a few microseconds of relay latency.
build_flags =
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DITANTRA_PROTOCOL_VERSION=1

lib_deps =
